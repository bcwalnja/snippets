<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Snippets</title>
    <link rel="icon" type="image/png" sizes="48x48" href="icons/clip-48.png">
    <link rel="stylesheet" href="./styles/styles.css">
    <link rel="stylesheet" href="./styles/card.css">
    <link rel="stylesheet" href="./styles/footer.css">
</head>

<body>
    <div id="app" class="app">
        <div class="wrapper">
            <header>
                <h2>The Snippets App</h2>
            </header>
            <nav></nav>
            <main>

                <div class="container">

                </div>

            </main>
            <aside></aside>
            <footer>
                <div class="footer-wrapper">
                    <button type="button" id="open-form">+</button>
                    <form id="new-card-form">
                        <input class="title" type="text" name="title" placeholder="Title" required />
                        <textarea class="content" type="text" name="content" placeholder="Content" required ></textarea>
                        <button type="submit">Save</button>
                        <button type="reset" class="cancel">Cancel</button>
                    </form>
                </div>
            </footer>

        </div>
    </div>
    <div id="toast">Copied</div>
    <div id="web">
        <button type="button" id="web-error" popovertarget="web-error-flyout" hidden>i</button>
        <button type="button" popovertarget="web-flyout">🌐</button>
    </div>
    <form id="web-flyout" popover>
        <input name="url" placeholder="Google Sheet link" />
        <button>Save</button>
    </form>
    <p id="web-error-flyout" popover>Couldn't load the Google Sheet. Check the link and make sure the sheet is shared as "Anyone with the link".</p>
    <script src="script.js"></script>
</body>

</html>
